<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Premium Store — Shop Online</title>
<meta name="description" content="Premium online shopping. Quality products, fast delivery, easy ordering.">
<meta property="og:title" content="Premium Store">
<meta property="og:description" content="Premium online shopping experience.">
<meta property="og:type" content="website">
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f7cff'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --primary:#4f7cff; --secondary:#8b5cf6; --accent:#22d3ee;
  --bg:#070b16; --surface:rgba(148,163,184,.07); --surface2:rgba(148,163,184,.12);
  --card:#0d1322; --border:rgba(148,163,184,.14); --border2:rgba(148,163,184,.22);
  --text:#e8edf7; --muted:#929ab0; --muted2:#6b7386;
  --success:#34d399; --warn:#fbbf24; --danger:#fb7185; --gold:#fbbf24;
  --radius:22px; --glow:.55;
  --grad:linear-gradient(135deg,var(--primary),var(--secondary));
  --shadow:0 10px 30px rgba(2,6,18,.45);
  --shadowglow:0 8px 26px color-mix(in srgb,var(--primary) calc(var(--glow)*45%),transparent);
  --hd:rgba(7,11,22,.82);
  --font:'Inter','Hind Siliguri',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;line-height:1.55;font-size:15px;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(700px 460px at 85% -8%,color-mix(in srgb,var(--secondary) 16%,transparent),transparent 62%),
    radial-gradient(640px 420px at 8% 4%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 60%),
    radial-gradient(500px 500px at 50% 110%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 65%);
  background-color:var(--bg);
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
::placeholder{color:var(--muted2)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* ============ SPLASH ============ */
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(600px 500px at 50% 30%,#0d1528,#070b16);transition:opacity .5s,visibility .5s}
#splash.done{opacity:0;visibility:hidden}
.splash-logo{width:86px;height:86px;border-radius:26px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:#fff;box-shadow:0 0 60px color-mix(in srgb,var(--primary) 55%,transparent);animation:spop .8s cubic-bezier(.2,1.4,.3,1)}
.splash-logo img{width:100%;height:100%;object-fit:cover;border-radius:26px}
@keyframes spop{from{transform:scale(.6);opacity:0}}
.splash-name{font-size:22px;font-weight:800;letter-spacing:.4px}
.splash-bar{width:120px;height:4px;border-radius:99px;background:var(--surface2);overflow:hidden}
.splash-bar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--grad);animation:sload 1.1s infinite ease-in-out}
@keyframes sload{0%{transform:translateX(-130%)}100%{transform:translateX(330%)}}

/* ============ ANNOUNCE ============ */
#announce{position:relative;z-index:60;background:var(--grad);color:#fff;font-size:12.5px;font-weight:600;overflow:hidden}
#announce .ann-track{display:flex;gap:48px;white-space:nowrap;padding:8px 0;animation:ann 18s linear infinite;width:max-content}
@keyframes ann{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ============ HEADER ============ */
#hdr{position:sticky;top:0;z-index:55;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:var(--hd);border-bottom:1px solid var(--border)}
.hdr-in{display:flex;align-items:center;gap:10px;max-width:1200px;margin:0 auto;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#fff;box-shadow:0 4px 16px color-mix(in srgb,var(--primary) 40%,transparent);flex:none;overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-name{font-weight:800;font-size:16.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.hdr-search{flex:1;display:none;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 14px;max-width:440px;margin:0 auto;color:var(--muted);cursor:pointer;transition:border-color .2s}
.hdr-search:hover{border-color:var(--border2)}
.hdr-search span{font-size:13.5px}
.hdr-icons{margin-left:auto;display:flex;align-items:center;gap:4px}
.iconbtn{position:relative;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted);transition:all .2s}
.iconbtn:hover,.iconbtn.on{color:var(--text);background:var(--surface2)}
.iconbtn .bdg{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--grad);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
@media(min-width:760px){.hdr-search{display:flex}}

/* chips */
#chipsbar{position:sticky;top:60px;z-index:54;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:var(--hd);border-bottom:1px solid var(--border)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:1200px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--muted);transition:all .2s;white-space:nowrap}
.chip.on,.chip:active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 35%,transparent)}

/* ============ HERO ============ */
.hero{position:relative;border-radius:calc(var(--radius) + 6px);overflow:hidden;margin-top:16px}
.hero-track{display:flex;transition:transform .55s cubic-bezier(.3,.8,.3,1)}
.hero-slide{position:relative;flex:0 0 100%;min-height:200px;cursor:pointer}
.hero-slide img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hero-slide::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(5,8,18,.85) 8%,rgba(5,8,18,.35) 55%,transparent)}
.hero-cap{position:relative;z-index:2;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;height:100%;min-height:200px;max-width:70%}
.hero-cap h2{font-size:clamp(19px,4.6vw,34px);font-weight:900;line-height:1.18;letter-spacing:-.3px}
.hero-cap p{color:#c3cbdd;font-size:13px;margin-top:8px;font-weight:500}
.hero-cta{margin-top:14px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:99px;background:var(--grad);color:#fff;font-weight:700;font-size:13px;box-shadow:var(--shadowglow)}
.hero-dots{position:absolute;bottom:14px;right:18px;z-index:3;display:flex;gap:6px}
.hero-dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.35);transition:all .3s;cursor:pointer}
.hero-dots i.on{width:22px;background:#fff}
@media(min-width:760px){.hero-slide,.hero-cap{min-height:340px}.hero-cap{padding:44px}}

/* promo strip */
.promo{margin-top:16px;border-radius:var(--radius);background:linear-gradient(120deg,color-mix(in srgb,var(--secondary) 26%,transparent),color-mix(in srgb,var(--primary) 22%,transparent));border:1px solid var(--border2);padding:18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.promo::before{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}
.promo .p-ic{width:48px;height:48px;flex:none;border-radius:15px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:var(--shadowglow)}
.promo h3{font-size:15.5px;font-weight:800}
.promo p{font-size:12.5px;color:var(--muted)}
.promo .btn{margin-left:auto;flex:none}

/* ============ SECTIONS ============ */
.sect{margin-top:30px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:14px}
.sec-head h2{font-size:18px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
.sec-head h2 i{color:var(--accent);font-size:15px}
.sec-head p{font-size:12px;color:var(--muted);margin-top:2px}
.sec-link{font-size:12.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:5px;white-space:nowrap}
@media(min-width:900px){.sec-head h2{font-size:22px}}

/* product grid */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.pgrid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:900px){.pgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1150px){.pgrid{grid-template-columns:repeat(5,1fr)}}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .pcard{flex:0 0 168px;scroll-snap-align:start}
@media(min-width:760px){.hscroll .pcard{flex-basis:210px}}

/* product card */
.pcard{position:relative;background:linear-gradient(180deg,var(--surface),transparent);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;display:flex;flex-direction:column}
@media(hover:hover){.pcard:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:0 14px 34px rgba(2,6,18,.55),0 0 0 1px color-mix(in srgb,var(--primary) 22%,transparent)}}
.pimg{position:relative;aspect-ratio:1;background:var(--surface);overflow:hidden;cursor:pointer}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
@media(hover:hover){.pcard:hover .pimg img{transform:scale(1.06)}}
.pbadge{position:absolute;top:10px;left:10px;z-index:2;padding:4px 10px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.poff{position:absolute;top:10px;right:10px;z-index:2;padding:4px 8px;border-radius:10px;font-size:10.5px;font-weight:800;background:rgba(6,9,20,.72);backdrop-filter:blur(6px);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.pwish{position:absolute;bottom:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:12px;background:rgba(6,9,20,.7);backdrop-filter:blur(6px);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:14px;color:#cbd5e1;transition:all .2s}
.pwish.on{color:#fb7185;border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.15)}
.pbody{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pname{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;min-height:36px}
.pstars{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.pstars .st{color:var(--gold);letter-spacing:1px;font-size:10.5px}
.pprice-row{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.pprice{font-size:16.5px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pold{font-size:12px;color:var(--muted2);text-decoration:line-through}
.pfoot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.psave{font-size:10.5px;font-weight:700;color:var(--success)}
.padd{width:36px;height:36px;border-radius:12px;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s}
.padd:active{transform:scale(.9)}
.padd:hover{background:var(--grad);border-color:transparent;color:#fff}
.pstock{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
.st-in{color:var(--success);background:rgba(52,211,153,.12)}
.st-low{color:var(--warn);background:rgba(251,191,36,.12)}
.st-out{color:var(--danger);background:rgba(251,113,133,.12)}
.st-soon{color:#c084fc;background:rgba(192,132,252,.12)}

/* categories grid */
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(min-width:640px){.catgrid{grid-template-columns:repeat(6,1fr)}}
.catcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .2s;cursor:pointer}
.catcard:hover{border-color:var(--border2);transform:translateY(-3px)}
.catcard .cic{width:46px;height:46px;border-radius:15px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 30%,transparent);overflow:hidden}
.catcard .cic img{width:100%;height:100%;object-fit:cover}
.catcard span{font-size:11.5px;font-weight:600;color:var(--muted)}

/* trust */
.trustgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.trustgrid{grid-template-columns:repeat(4,1fr)}}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tcard i{width:40px;height:40px;border-radius:13px;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px}
.tcard h4{font-size:13px;font-weight:700}
.tcard p{font-size:11.5px;color:var(--muted);line-height:1.5}

/* reviews */
.revcard{flex:0 0 280px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px}
@media(min-width:760px){.revcard{flex-basis:340px}}
.revcard .rh{display:flex;align-items:center;gap:10px}
.revcard .av{width:40px;height:40px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;overflow:hidden;flex:none}
.revcard .av img{width:100%;height:100%;object-fit:cover}
.revcard .rn{font-size:13.5px;font-weight:700}
.revcard .rl{font-size:10.5px;color:var(--muted)}
.revcard .rt{font-size:13px;color:#c9d1e2;line-height:1.6}
.revbadge{font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.revbadge.f{background:rgba(251,191,36,.14);color:var(--gold)}
.revbadge.v{background:rgba(52,211,153,.14);color:var(--success)}

/* poll */
.pollcard{background:linear-gradient(150deg,var(--surface),transparent);border:1px solid var(--border2);border-radius:calc(var(--radius) + 4px);padding:22px;max-width:640px}
.pollcard h3{font-size:17px;font-weight:800}
.pollcard .psub{font-size:12px;color:var(--muted);margin-top:4px}
.popt{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:13px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);text-align:left;font-size:13.5px;font-weight:600;transition:all .2s}
.popt:hover{border-color:var(--accent)}
.popt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted2);flex:none}
.pres{margin-top:12px}
.pres .pr{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:5px}
.pres .bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pres .bar i{display:block;height:100%;border-radius:99px;background:var(--grad);box-shadow:0 0 12px color-mix(in srgb,var(--primary) 50%,transparent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pollfoot{margin-top:12px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* steps */
.steps{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.step .num{position:absolute;right:14px;top:8px;font-size:44px;font-weight:900;color:var(--surface2);line-height:1}
.step i{color:var(--accent);font-size:20px}
.step h4{font-size:14px;font-weight:700;margin-top:10px}
.step p{font-size:12px;color:var(--muted);margin-top:4px}

/* faq */
.faqitem{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:8px;overflow:hidden}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;font-size:13.5px;font-weight:700;text-align:left}
.faq-q i{color:var(--muted);transition:transform .3s;font-size:12px}
.faqitem.open .faq-q i{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease}
.faq-a p{padding:0 18px 16px;font-size:13px;color:var(--muted);line-height:1.7}

/* limited offer */
.limited{border-radius:calc(var(--radius) + 4px);background:linear-gradient(130deg,color-mix(in srgb,var(--danger) 16%,transparent),color-mix(in srgb,var(--secondary) 20%,transparent));border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);padding:24px;text-align:center;position:relative;overflow:hidden}
.limited h3{font-size:20px;font-weight:900}
.limited p{color:var(--muted);font-size:12.5px;margin-top:6px}
.count{display:flex;gap:10px;justify-content:center;margin-top:16px}
.count .cb{width:64px;padding:10px 0;border-radius:14px;background:rgba(5,8,18,.55);border:1px solid var(--border2)}
.count .cb b{font-size:21px;font-weight:900;display:block;font-variant-numeric:tabular-nums}
.count .cb span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}

/* newsletter */
.news{border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);padding:22px;text-align:center}
.news h3{font-size:17px;font-weight:800}
.news p{color:var(--muted);font-size:12.5px;margin-top:4px}
.news form{display:flex;gap:8px;margin-top:14px;max-width:420px;margin-left:auto;margin-right:auto}
.news input{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:14px;padding:12px 16px;font-size:13.5px}

/* footer */
footer{margin-top:44px;border-top:1px solid var(--border);background:rgba(5,8,18,.5);padding:34px 0 110px}
@media(min-width:900px){footer{padding-bottom:40px}}
.fgrid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:760px){.fgrid{grid-template-columns:2fr 1fr 1fr 1.3fr}}
footer h5{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px}
footer a.fl{display:block;font-size:13px;color:var(--muted);padding:4px 0;transition:color .2s}
footer a.fl:hover{color:var(--text)}
.fbrand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.socialrow{display:flex;gap:8px;margin-top:14px}
.socialrow a{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);transition:all .2s}
.socialrow a:hover{background:var(--grad);color:#fff;transform:translateY(-2px)}
.fcopy{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted2);text-align:center}

/* ============ BOTTOM NAV ============ */
#bnav{position:fixed;bottom:0;left:0;right:0;z-index:60;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(7,10,20,.86);border-top:1px solid var(--border);display:flex;padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
@media(min-width:900px){#bnav{display:none}}
.bn-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:14px;color:var(--muted);font-size:9.8px;font-weight:700;position:relative;transition:color .2s}
.bn-it i{font-size:17px}
.bn-it.on{color:var(--accent)}
.bn-it .bdg{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--grad);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* ============ VIEWS ============ */
#view{min-height:60vh;padding-bottom:24px}
.page-fade{animation:pfade .35s ease}
@keyframes pfade{from{opacity:0;transform:translateY(10px)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:16px;font-weight:700;font-size:14px;transition:transform .15s,box-shadow .2s,background .2s;position:relative}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--grad);color:#fff;box-shadow:var(--shadowglow)}
.btn-p:hover{box-shadow:0 10px 30px color-mix(in srgb,var(--primary) 50%,transparent)}
.btn-g{background:var(--surface2);border:1px solid var(--border2);color:var(--text)}
.btn-wa{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 8px 22px rgba(34,197,94,.3)}
.btn-fb{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 8px 22px rgba(59,130,246,.3)}
.btn-dg{background:rgba(251,113,133,.14);color:var(--danger);border:1px solid rgba(251,113,133,.3)}
.btn.sm{padding:9px 15px;font-size:12.5px;border-radius:12px}
.btn.lg{padding:15px 26px;font-size:15px;border-radius:18px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rt .7s linear infinite}
@keyframes rt{to{transform:rotate(360deg)}}

/* skeleton */
.skel{position:relative;overflow:hidden;background:var(--surface);border-radius:var(--radius)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shim 1.4s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.skcard{height:250px;border-radius:var(--radius)}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;text-align:center}
.empty .eic{width:78px;height:78px;border-radius:26px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.empty h3{font-size:16px;font-weight:800}
.empty p{font-size:12.5px;color:var(--muted);max-width:280px}

/* toast */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;width:min(92vw,400px)}
.toast{display:flex;align-items:center;gap:10px;background:rgba(10,15,30,.92);backdrop-filter:blur(14px);border:1px solid var(--border2);border-radius:16px;padding:12px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:tin .3s cubic-bezier(.2,1.2,.3,1)}
.toast.ok i{color:var(--success)}.toast.err i{color:var(--danger)}.toast.info i{color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.toast.out{animation:tout .3s forwards}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

/* ============ SHEET / MODAL ============ */
.sheetwrap{position:fixed;inset:0;z-index:200;visibility:hidden}
.sheetwrap.open{visibility:visible}
.sheet-bg{position:absolute;inset:0;background:rgba(3,5,12,.66);backdrop-filter:blur(4px);opacity:0;transition:opacity .3s}
.sheetwrap.open .sheet-bg{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:#0b1120;border:1px solid var(--border2);border-bottom:none;border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.sheetwrap.open .sheet{transform:translateY(0)}
.sheet .grip{width:42px;height:5px;border-radius:99px;background:var(--surface2);margin:10px auto 4px;flex:none}
.sheet .sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border)}
.sheet .sh-head h3{font-size:16px;font-weight:800}
.sheet .sh-body{overflow-y:auto;padding:18px 20px 30px}
@media(min-width:900px){
  .sheet{position:absolute;left:50%;top:50%;bottom:auto;transform:translate(-50%,100vh) scale(.95);border-radius:26px;border:1px solid var(--border2);width:min(94vw,600px);max-height:86vh}
  .sheetwrap.open .sheet{transform:translate(-50%,-50%) scale(1)}
  .sheet.wide{width:min(94vw,860px)}
}
.fgroup{margin-bottom:18px}
.fgroup h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px}
.radiocard{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:13px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s}
.radiocard.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.radiocard .rdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted2);flex:none;position:relative}
.radiocard.on .rdot{border-color:var(--accent)}
.radiocard.on .rdot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}

/* fields */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:13px 15px;font-size:14px;transition:border-color .2s;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field .hint{font-size:11px;color:var(--muted2);margin-top:5px}
.field.err input,.field.err select,.field.err textarea{border-color:var(--danger)}
.field .emsg{font-size:11px;color:var(--danger);margin-top:5px;font-weight:600}
select option{background:#0d1526;color:var(--text)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* toggle */
.tgl{position:relative;width:46px;height:26px;flex:none}
.tgl input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2}
.tgl .tk{position:absolute;inset:0;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);transition:all .25s}
.tgl .tk::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#8b93a7;transition:all .25s}
.tgl input:checked + .tk{background:var(--grad);border-color:transparent}
.tgl input:checked + .tk::after{left:22px;background:#fff}

/* ============ PRODUCT PAGE ============ */
.pdp-top{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:900px){.pdp-top{grid-template-columns:1.05fr 1fr;gap:36px}}
.gal{position:relative;border-radius:calc(var(--radius) + 4px);overflow:hidden;background:var(--surface);border:1px solid var(--border);aspect-ratio:1}
.gal img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.gal .gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:14px;background:rgba(5,8,18,.6);backdrop-filter:blur(8px);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:14px;z-index:3;transition:all .2s}
.gal .gnav:hover{background:rgba(5,8,18,.85)}
.gal .prev{left:12px}.gal .next{right:12px}
.gal .gcount{position:absolute;bottom:12px;right:12px;padding:4px 11px;border-radius:99px;background:rgba(5,8,18,.65);backdrop-filter:blur(6px);font-size:11px;font-weight:700;z-index:3}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{width:64px;height:64px;flex:none;border-radius:14px;overflow:hidden;border:2px solid var(--border);cursor:pointer;opacity:.6;transition:all .2s;background:var(--surface)}
.thumb.on{border-color:var(--accent);opacity:1}
.thumb img{width:100%;height:100%;object-fit:cover}
.pdp-info h1{font-size:20px;font-weight:800;line-height:1.3;letter-spacing:-.2px}
@media(min-width:900px){.pdp-info h1{font-size:27px}}
.pdp-meta{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.pdp-meta .pstars{font-size:12px}
.pricebox{margin-top:16px;padding:16px 18px;border-radius:18px;background:linear-gradient(120deg,var(--surface),transparent);border:1px solid var(--border2);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pricebox .now{font-size:27px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pricebox .was{font-size:15px;color:var(--muted2);text-decoration:line-through}
.offpill{padding:5px 11px;border-radius:99px;background:rgba(52,211,153,.14);color:var(--success);font-size:11.5px;font-weight:800}
.varwrap{margin-top:16px}
.vchips{display:flex;gap:8px;flex-wrap:wrap}
.vchip{padding:9px 16px;border-radius:13px;background:var(--surface);border:1px solid var(--border2);font-size:12.5px;font-weight:600;transition:all .2s}
.vchip.on{background:color-mix(in srgb,var(--primary) 16%,transparent);border-color:var(--primary);color:#cdd9ff}
.qty{display:inline-flex;align-items:center;gap:0;border:1px solid var(--border2);border-radius:14px;overflow:hidden;background:var(--surface)}
.qty button{width:42px;height:42px;font-size:15px;color:var(--muted);transition:all .2s;display:flex;align-items:center;justify-content:center}
.qty button:hover{color:var(--text);background:var(--surface2)}
.qty b{width:44px;text-align:center;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.tbadges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tbadge{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted)}
.tbadge i{color:var(--accent);font-size:12px}
.ctabar{position:sticky;bottom:0;z-index:50;margin:22px -16px -24px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(7,10,20,.88);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;gap:10px}
@media(min-width:900px){.ctabar{position:static;background:none;border:none;padding:0;margin:22px 0 0;backdrop-filter:none}}
.ctabar .btn{flex:1}
.ctabar .cico{width:50px;flex:none;padding:0}
.ptabs{margin-top:30px}
.ptab-btns{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:5px}
.ptab-btns button{flex:1;padding:11px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--muted);transition:all .2s}
.ptab-btns button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 30%,transparent)}
.ptab-pane{padding-top:18px;font-size:13.5px;color:#c3cbdc;line-height:1.75}
.spect{width:100%;border-collapse:collapse}
.spect td{padding:11px 12px;font-size:13px;border-bottom:1px solid var(--border)}
.spect td:first-child{color:var(--muted);font-weight:600;width:42%}
.spect tr:last-child td{border-bottom:none}
.revitem{padding:16px 0;border-bottom:1px solid var(--border)}
.revitem:last-child{border-bottom:none}
.revitem .rh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.revitem .av{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;overflow:hidden;flex:none}
.revitem .av img{width:100%;height:100%;object-fit:cover}
.rreply{margin-top:10px;padding:11px 14px;border-radius:12px;background:var(--surface);border-left:3px solid var(--accent);font-size:12.5px;color:var(--muted)}
.rreply b{color:var(--accent);font-size:11px;display:block;margin-bottom:3px}
.sharebtns{display:flex;gap:8px}
.sbtn{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;color:var(--muted)}
.sbtn:hover{color:#fff;background:var(--grad);border-color:transparent}

/* fullscreen viewer */
#fsview{position:fixed;inset:0;z-index:500;background:rgba(3,5,10,.96);display:none;align-items:center;justify-content:center;flex-direction:column}
#fsview.open{display:flex;animation:pfade .25s}
#fsview img{max-width:96vw;max-height:82vh;object-fit:contain;border-radius:14px}
#fsview .fclose{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:14px;background:var(--surface2);border:1px solid var(--border2);font-size:16px;z-index:2}
#fsview .fcount{position:absolute;bottom:26px;padding:6px 14px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:700}
#fsview .fnav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:15px;background:var(--surface2);border:1px solid var(--border2);font-size:15px}
#fsview .fprev{left:14px}#fsview .fnext{right:14px}

/* ============ CART ============ */
.citem{display:flex;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px}
.citem img{width:74px;height:74px;border-radius:14px;object-fit:cover;flex:none;background:var(--surface2)}
.citem .ci-n{font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.citem .ci-v{font-size:11px;color:var(--muted);margin-top:2px}
.citem .ci-p{font-size:14.5px;font-weight:800;margin-top:5px}
.citem .ci-r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;margin-left:auto;flex:none}
.cdel{width:32px;height:32px;border-radius:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s}
.cdel:hover{color:var(--danger);background:rgba(251,113,133,.1)}
.qty.sm button{width:32px;height:32px;font-size:13px}
.qty.sm b{width:32px;font-size:13px}
.totcard{border-radius:20px;background:linear-gradient(150deg,var(--surface),transparent);border:1px solid var(--border2);padding:20px;margin-top:16px}
.trow{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--muted)}
.trow b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.trow.grand{border-top:1px dashed var(--border2);margin-top:10px;padding-top:14px;font-size:15px}
.trow.grand b{font-size:20px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.trow .free{color:var(--success);font-weight:800}

/* checkout */
.paycard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px;cursor:pointer;transition:all .2s}
.paycard.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.paycard .pic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;color:#fff}
.paycard .pl{font-size:13.5px;font-weight:700}
.paycard .pd{font-size:11px;color:var(--muted)}
.paycard .rdot{margin-left:auto}
.successwrap{max-width:480px;margin:30px auto;text-align:center}
.suc-ic{width:90px;height:90px;margin:0 auto 18px;border-radius:30px;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;box-shadow:0 0 60px rgba(34,197,94,.4);animation:spop .6s cubic-bezier(.2,1.4,.3,1)}
.oid{font-size:13px;font-weight:800;padding:8px 18px;border-radius:99px;background:var(--surface);border:1px dashed var(--border2);display:inline-flex;gap:8px;align-items:center;margin:14px 0}

/* orders / account */
.ocard{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:10px}
.ocard .oh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ocard .oid2{font-size:13.5px;font-weight:800}
.ocard .od{font-size:11px;color:var(--muted)}
.status{font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
.status.new{background:rgba(34,211,238,.13);color:var(--accent)}
.status.pending{background:rgba(251,191,36,.13);color:var(--warn)}
.status.confirmed{background:rgba(96,165,250,.13);color:#60a5fa}
.status.processing{background:rgba(139,92,246,.15);color:#a78bfa}
.status.shipped{background:rgba(56,189,248,.13);color:#38bdf8}
.status.delivered{background:rgba(52,211,153,.13);color:var(--success)}
.status.cancelled{background:rgba(251,113,133,.13);color:var(--danger)}
.othumbs{display:flex;gap:6px;margin-top:10px}
.othumbs img{width:42px;height:42px;border-radius:10px;object-fit:cover;background:var(--surface2)}
.ototal{margin-top:10px;font-size:14px;font-weight:800}
.profcard{background:linear-gradient(140deg,var(--surface),transparent);border:1px solid var(--border2);border-radius:22px;padding:22px;display:flex;align-items:center;gap:16px;margin-bottom:16px}
.profcard .pav{width:62px;height:62px;border-radius:22px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;flex:none}
.menulist{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:12px}
.menulist button,.menulist a{width:100%;display:flex;align-items:center;gap:13px;padding:15px 17px;font-size:13.5px;font-weight:600;color:var(--text);transition:background .2s;text-align:left}
.menulist button:hover,.menulist a:hover{background:var(--surface2)}
.menulist i.mic{width:34px;height:34px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--accent);flex:none}
.menulist i.arr{margin-left:auto;color:var(--muted2);font-size:11px}

/* search overlay */
#searchov{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column}
#searchov.open{display:flex;animation:pfade .25s}
.so-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.so-box{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:11px 14px}
.so-box input{flex:1;background:none;border:none;outline:none;font-size:15px}
.so-box .clr{color:var(--muted);font-size:14px;padding:2px}
.so-res{flex:1;overflow-y:auto;padding:14px 16px 90px}
.sug{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;transition:background .2s;cursor:pointer}
.sug:hover{background:var(--surface)}
.sug img{width:52px;height:52px;border-radius:13px;object-fit:cover;background:var(--surface2);flex:none}
.sug .sn{font-size:13.5px;font-weight:600}
.sug .sp{font-size:12px;color:var(--muted);margin-top:2px}
.sug i{margin-left:auto;color:var(--muted2);font-size:11px}
.recclear{font-size:12px;color:var(--danger);font-weight:700}
.recentchips{display:flex;gap:8px;flex-wrap:wrap}
.recentchips button{padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--muted)}

/* shop toolbar */
.toolbar{display:flex;align-items:center;gap:10px;margin:16px 0 14px}
.toolbar .tbtn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:13px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--muted)}
.toolbar .tbtn i{font-size:12px;color:var(--accent)}
.rescnt{font-size:12px;color:var(--muted);font-weight:600}

  const c=getCart();const ex=c.find(i=>i.pid===pid&&i.variant===variant);

}

  const now=Number(p.offerPrice)>0?Number(p.offerPrice):Number(p.regularPrice)||0;
  const was=Number(p.regularPrice)||0;
  const off=(was>0&&now>0&&was>now)?Math.round((1-now/was)*100):0;
  return{now,was,off,save:was>now?was-now:0};
}

}

function socialOrder(kind,p){
  const c=S.settings.contact||{};
  if(kind==='wa'||kind==='copymsg'){
    if(!c.whatsapp){toast('WhatsApp ordering is not available right now','info');return;}
    const n=String(c.whatsapp).replace(/\D/g,'');
    window.open('https://wa.me/'+n+'?text='+encodeURIComponent(pdpTexts(p)),'_blank','noopener');
  }else if(kind==='fb'){
    const url=c.messenger||c.fbPage;
    if(!url){toast('Facebook ordering is not available right now','info');return;}
    navigator.clipboard&&navigator.clipboard.writeText(pdpTexts(p)).catch(()=>{});
    toast('Order details copied — paste in Messenger','info');
    window.open(safeUrl(url),'_blank','noopener');
  }else if(kind==='share'){
    const data={title:p.name,text:p.shortDesc||p.name,url:location.origin+location.pathname+'?p='+p.id};
    if(navigator.share)navigator.share(data).catch(()=>{});

  }else if(kind==='copy'){copyText(location.origin+location.pathname+'?p='+p.id);toast('Product link copied');}
}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));else fallbackCopy(t);}

document.addEventListener('click',e=>{

  const vc=e.target.closest('[data-var]');if(vc){PDP.variant=vc.dataset.var;renderRoute(true);return;}
  const th=e.target.closest('[data-th]');if(th){PDP.img=Number(th.dataset.th);renderRoute(true);return;}

    $$('#rateStars i').forEach((s2,i)=>s2.className=`fa${i<n?'-solid':'-regular'} fa-star`);return;}

function submitReview(){
  const rating=Number($('#revRate').value),name=$('#revName').value.trim(),text=$('#revText').value.trim();
  if(!rating){toast('Please select a star rating','err');return;}
  if(name.length<2){toast('Please enter your name','err');return;}
  if(text.length<4){toast('Please write a short review','err');return;}
  const btn=$('#revSubmit');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Submitting';
  const rec={product:PDP.id,name,rating,text,ts:Date.now(),approved:false,verified:false,featured:false,location:(getCust()||{}).district||''};
  const done=()=>{toast('Review submitted — pending approval');$('#revText').value='';$('#revRate').value=0;$$('#rateStars i').forEach(s2=>s2.className='fa-regular fa-star');btn.disabled=false;btn.textContent='Submit Review';};
  if(fbOK)DB.ref('reviews').push(rec).then(done).catch(()=>{toast('Could not submit now — try again','err');btn.disabled=false;btn.textContent='Submit Review';});
  else{toast('You are offline — try later','err');btn.disabled=false;btn.textContent='Submit Review';}
}

function cartItems(){return getCart().map(i=>({...i,p:getProd(i.pid)})).filter(i=>i.p);}
function cartTotals(){

  cartItems().forEach(i=>{const pi=priceInfo(i.p);sub+=pi.now*i.qty;if(pi.was)was+=pi.was*i.qty;else was+=pi.now*i.qty;});
  return{sub,was,disc:Math.max(0,was-sub)};
}

  if(msg){f.classList.add('err');f.insertAdjacentHTML('beforeend',`<div class="emsg"><i class="fa-solid fa-circle-exclamation"></i> ${esc(msg)}</div>`);return false;}return true;}
function placeOrder(){
  if(PLACING)return;
  const name=$('#ckName').value.trim(),phone=$('#ckPhone').value.replace(/\D/g,''),email=$('#ckEmail').value.trim(),
        addr=$('#ckAddr').value.trim(),dist=$('#ckDist').value,area=$('#ckArea').value.trim(),note=$('#ckNote').value.trim();
  let ok=true;
  ok=fieldErr('#ckName',name.length<3?'Please enter your full name':'')&&ok;
  ok=fieldErr('#ckPhone',!/^0?1[3-9]\d{8}$/.test(phone)?'Enter a valid mobile number (01XXXXXXXXX)':'')&&ok;
  ok=fieldErr('#ckAddr',addr.length<6?'Please enter your full address':'')&&ok;
  ok=fieldErr('#ckDist',!dist?'Please select your district':'')&&ok;
  if(!ok){toast('Please complete the required fields','err');return;}
  const items=cartItems();if(!items.length)return;
  const t=cartTotals();const del=deliveryFor(dist,t.sub);
  const pm=payMethods().find(m=>m.id===CK.pay)||{};
  const order={
    orderId:'ORD-'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*90+10),
    customer:{name,phone,email,address:addr,district:dist,area,note},
    items:items.map(i=>{const pi=priceInfo(i.p);return{pid:i.pid,name:i.p.name,variant:i.variant||'',qty:i.qty,price:pi.now,was:pi.was||0,image:(i.p.images&&i.p.images[0])||i.p.thumb||''}}),
    subtotal:t.sub,discount:t.disc,delivery:del,total:t.sub+del,
    payment:CK.pay,paymentLabel:pm.label||CK.pay,source:'website',status:'pending',note:'',ts:Date.now()
  };
  PLACING=true;const btn=$('#ckPlace');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Placing order…';
  const finish=ok2=>{
    PLACING=false;
    if(!ok2){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-circle-check"></i>Confirm Order';toast('Order could not be placed — please try again','err');return;}
    saveCart([]);
    L.set('ec_lastorder',order);
    renderSuccess(order);
  };
  if(!fbOK){toast('Connection issue — trying when online','err');finish(false);return;}
  DB.ref('orders').push(order).then(()=>{
    DB.ref('analytics/summary/orders').transaction(v=>(v||0)+1).catch(()=>{});
    items.forEach(i=>{if(typeof i.p.stock==='number'||i.p.stock!==undefined&&!isNaN(Number(i.p.stock)))
      DB.ref('products/'+i.pid+'/stock').transaction(v=>{const n=Number(v);return isNaN(n)?v:Math.max(0,n-i.qty)}).catch(()=>{});});
    if(getCust())DB.ref('customers/'+phone).update({name,address:addr,district:dist,area,email,lastOrder:Date.now()}).catch(()=>{});
    finish(true);
  }).catch(()=>finish(false));
}

let SHOP={sort:'popular',stock:'all',deal:false,cat:'',q:''};
const SORTS=[['popular','Most Popular'],['newest','Newest First'],['priceAsc','Price: Low to High'],['priceDesc','Price: High to Low'],['discount','Biggest Discount'],['best','Best Selling']];
function shopList(cat){
  let l=prodList();
  if(cat)l=l.filter(p=>p.category===cat);
  if(SHOP.q){const q=SHOP.q.toLowerCase();l=l.filter(p=>[p.name,p.shortTitle,p.brand,p.sku,catName(p.category),...(p.keywords||[])].filter(Boolean).join(' ').toLowerCase().includes(q));}
  if(SHOP.deal)l=l.filter(p=>priceInfo(p).off>0);
  if(SHOP.stock!=='all')l=l.filter(p=>stockOf(p)===SHOP.stock);
  const by={popular:(a,b)=>((ratingOf(b.id).count)+(b.sold||0))-((ratingOf(a.id).count)+(a.sold||0))||byOrder(a,b),
    newest:(a,b)=>(b.ts||b.createdAt||0)-(a.ts||a.createdAt||0),
    priceAsc:(a,b)=>priceInfo(a).now-priceInfo(b).now,
    priceDesc:(a,b)=>priceInfo(b).now-priceInfo(a).now,
    discount:(a,b)=>priceInfo(b).off-priceInfo(a).off,
    best:(a,b)=>(b.sold||0)-(a.sold||0)};
  return l.sort(by[SHOP.sort]||byOrder);
}

const getRecent=()=>L.get('ec_recent',[]);
function addRecent(q){if(!q||q.length<2)return;let r=getRecent().filter(x=>x.toLowerCase()!==q.toLowerCase());r.unshift(q);L.set('ec_recent',r.slice(0,8));}
function searchProducts(q){
  q=q.trim().toLowerCase();if(!q)return[];
  return prodList().map(p=>{
    const hay={n:(p.name||'')+' '+(p.shortTitle||''),s:p.sku||'',b:p.brand||'',c:catName(p.category)||'',k:(p.keywords||[]).join(' ')};
    let sc=0;
    if(hay.n.toLowerCase().includes(q))sc+=6;if(hay.s.toLowerCase()===q)sc+=10;if(hay.s.toLowerCase().includes(q)&&q.length>2)sc+=4;
    if(hay.b.toLowerCase().includes(q))sc+=3;if(hay.c.toLowerCase().includes(q))sc+=2;if(hay.k.toLowerCase().includes(q))sc+=2;
    return sc?{p,sc}:null;
  }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,12).map(x=>x.p);
}
function renderSuggest(q){
  const box=$('#soRes');$('#soClear').classList.toggle('hidden',!q);
  if(!q){
    const rec=getRecent();const pop=prodList().filter(p=>p.featured||p.trending).slice(0,5);
    box.innerHTML=`${rec.length?`<div class="fgroup"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h4 style="margin:0">Recent Searches</h4><button class="recclear" id="recClear">Clear</button></div><div class="recentchips">${rec.map(r=>`<button data-seat="${esc(r)}"><i class="fa-solid fa-clock-rotate-left" style="font-size:10px;margin-right:6px"></i>${esc(r)}</button>`).join('')}</div></div>`:''}
    ${pop.length?`<div class="fgroup"><h4>Popular Right Now</h4>${pop.map(sugHTML).join('')}</div>`:''}`;
  }else{
    const res=searchProducts(q);
    box.innerHTML=res.length?`<div class="fgroup"><h4>${res.length} result${res.length>1?'s':''}</h4>${res.map(sugHTML).join('')}</div>`
     :`<div class="empty"><div class="eic"><i class="fa-solid fa-magnifying-glass-minus"></i></div><h3>No results for “${esc(q)}”</h3><p>Check spelling or try a different keyword.</p></div>`;
  }
}
function sugHTML(p){const pi=priceInfo(p);return`<div class="sug" data-pid="${esc(p.id)}"><img src="${safeImg((p.images&&p.images[0])||p.thumb)}" alt="" onerror="this.onerror=null;this.src=PLH"><div style="min-width:0"><div class="sn">${esc(p.shortTitle||p.name)}</div><div class="sp">${fmt(pi.now)} · ${esc(catName(p.category)||'')}</div></div><i class="fa-solid fa-arrow-up-right-from-square"></i></div>`;}

    closeSheet();toast('Profile updated');renderRoute(true);return;}
});
function loginCust(){
  const phone=$('#alPhone').value.replace(/\D/g,''),pass=$('#alPass').value;
  if(!/^0?1[3-9]\d{8}$/.test(phone))return toast('Enter a valid mobile number','err');
  if(pass.length<4)return toast('Enter your PIN','err');
  const btn=$('#alGo');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Checking';
  if(!fbOK){toast('Connection required for login','err');btn.disabled=false;btn.textContent='Login';return;}
  DB.ref('customers').orderByChild('phone').equalTo(phone).once('value').then(snap=>{
    btn.disabled=false;btn.textContent='Login';
    if(!snap.exists())return toast('No account found — please register','err');
    const[id,c]=Object.entries(snap.val())[0];
    if(c.blocked)return toast('This account is disabled. Contact support.','err');
    if(c.pass!==encPass(pass))return toast('Incorrect PIN','err');
    delete c.pass;saveSession({id,...c});toast('Welcome back, '+(c.name||'').split(' ')[0]+'!');renderRoute();
  }).catch(()=>{btn.disabled=false;btn.textContent='Login';toast('Login failed — try again','err');});
}
function regCust(){
  const name=$('#arName').value.trim(),phone=$('#arPhone').value.replace(/\D/g,''),pass=$('#arPass').value,
        email=$('#arEmail').value.trim(),district=$('#arDist').value,address=$('#arAddr').value.trim();
  if(name.length<3)return toast('Enter your full name','err');
  if(!/^0?1[3-9]\d{8}$/.test(phone))return toast('Enter a valid mobile number','err');
  if(pass.length<4)return toast('PIN must be 4+ characters','err');
  const btn=$('#arGo');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Creating';
  if(!fbOK){toast('Connection required','err');btn.disabled=false;btn.textContent='Create Account';return;}
  DB.ref('customers').orderByChild('phone').equalTo(phone).once('value').then(snap=>{
    if(snap.exists()){btn.disabled=false;btn.textContent='Create Account';return toast('Account exists — please login','err');}
    const rec={name,phone,email,district,address,pass:encPass(pass),createdAt:Date.now(),blocked:false};
    DB.ref('customers').push(rec).then(ref=>{
      saveSession({id:ref.key,name,phone,email,district,address,createdAt:rec.createdAt});
      btn.disabled=false;btn.textContent='Create Account';toast('Account created — welcome!');renderRoute();
    }).catch(()=>{btn.disabled=false;btn.textContent='Create Account';toast('Could not register now','err');});
  });
}

/* ============ TRACK ORDERS ============ */
let TRACKED={phone:'',list:null};

  const items=o.items||[];
  return`<div class="ocard">
    <div class="oh"><div><div class="oid2"><i class="fa-solid fa-hashtag" style="color:var(--accent);font-size:11px"></i>${esc(o.orderId)}</div>
    <div class="od">${o.ts?fmtDate(o.ts):''} · ${esc(o.paymentLabel||o.payment||'')}</div></div>
    <span class="status ${esc(o.status||'pending')}">${esc(o.status||'pending')}</span></div>
    <div class="othumbs">${items.slice(0,5).map(i=>`<img src="${safeImg(i.image)}" alt="" onerror="this.onerror=null;this.src=PLH">`).join('')}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">${items.map(i=>`${esc(i.name)}${i.variant?' ('+esc(i.variant)+')':''} × ${i.qty}`).join(' · ')}</div>
    ${o.note?`<div class="rreply" style="margin-top:10px"><b>Note from store</b>${esc(o.note)}</div>`:''}
    <div class="ototal">Total: ${fmt(o.total)}</div></div>`;
}
function vTrack(){
  const cu=getCust();
  return`<div class="container" style="padding-top:22px;max-width:640px">
   <div class="subhead"><button class="bbtn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button><div><h1>Track Orders</h1><p>Enter your order phone number</p></div></div>
   <div style="display:flex;gap:10px;margin-top:10px">
     <div class="so-box" style="flex:1"><i class="fa-solid fa-phone" style="color:var(--muted)"></i>

   </div>
   <div id="tkRes" style="margin-top:18px">
    ${TRACKED.list===null?`<div class="empty" style="padding:40px"><div class="eic"><i class="fa-solid fa-box"></i></div><h3>Find your orders</h3><p>Enter the mobile number used during checkout to see live order status.</p></div>`
     :TRACKED.list.length?TRACKED.list.map(orderCard).join('')
     :`<div class="empty" style="padding:40px"><div class="eic"><i class="fa-solid fa-circle-question"></i></div><h3>No orders found</h3><p>No orders were placed with this number yet.</p><a class="btn btn-p" href="#/shop">Shop Now</a></div>`}
   </div>

document.addEventListener('click',e=>{
  if(e.target.id==='tkGo'||e.target.closest('#tkGo'))trackOrders();
});
document.addEventListener('keydown',e=>{if(e.target.id==='tkPhone'&&e.key==='Enter')trackOrders();});
function trackOrders(){
  const phone=$('#tkPhone').value.replace(/\D/g,'');
  if(!/^0?1[3-9]\d{8}$/.test(phone))return toast('Enter a valid mobile number','err');
  const btn=$('#tkGo');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  const box=$('#tkRes');box.innerHTML='<div class="skel" style="height:120px;margin-bottom:10px"></div><div class="skel" style="height:120px"></div>';
  if(!fbOK){btn.disabled=false;btn.innerHTML='Find';toast('Connection issue','err');return;}
  TRACKED.phone=phone;
  DB.ref('orders').orderByChild('customer/phone').equalTo(phone).once('value').then(snap=>{
    btn.disabled=false;btn.innerHTML='Find<i class="fa-solid fa-magnifying-glass" style="font-size:12px"></i>';
    const list=snap.val()?Object.entries(snap.val()).map(([id,o])=>({id,...o})).sort((a,b)=>(b.ts||0)-(a.ts||0)):[];
    TRACKED.list=list;
    box.innerHTML=list.length?list.map(orderCard).join(''):`<div class="empty" style="padding:40px"><div class="eic"><i class="fa-solid fa-circle-question"></i></div><h3>No orders found</h3><p>No orders were placed with this number yet.</p><a class="btn btn-p" href="#/shop">Shop Now</a></div>`;
  }).catch(()=>{btn.disabled=false;btn.innerHTML='Find';toast('Could not load orders','err');});
}

/* ============ FIREBASE LISTENERS ============ */
let pollSub=null,firstPaint=false;
function node(name,fn,minGap=900){
  let last=0,t=null;
  DB.ref(name).on('value',snap=>{
    fn(snap.val());
    const now=Date.now();clearTimeout(t);
    if(now-last>minGap){last=now;refreshChrome();}
    else t=setTimeout(()=>{last=Date.now();refreshChrome();},minGap);
  },err=>{console.warn(name,err);});
}
function subscribePollVotes(){
  if(pollSub){try{pollSub.off()}catch(e){}pollSub=null;}
  const poll=activePoll();if(!poll)return;
  pollSub=DB.ref('pollVotes/'+poll.id);
  pollSub.on('value',snap=>{
    S.pollVotes=S.pollVotes||{};
    const remote=snap.val()||{};
    const locals=Object.entries(S.pollVotes[poll.id]||{}).filter(([k,v])=>v&&v.local);
    S.pollVotes[poll.id]={...remote,...Object.fromEntries(locals)};
    const r=parseHash();if(r.name===''||r.name==='home')refreshChrome();
  });
}
function boot(){
  applyTheme();renderChips();updateCartBadges();
  /* skeleton while loading */
  $('#view').innerHTML=`<div class="container" style="padding-top:16px">
    <div class="skel" style="height:190px;border-radius:26px"></div>
    <div class="sect"><div class="skel" style="height:20px;width:160px;margin-bottom:14px"></div>
    <div class="pgrid">${'<div class="skel skcard"></div>'.repeat(4)}</div></div></div>`;
  if(!fbOK){
    S.settings=deepMerge(DEF,{});S.ready=true;firstPaint=true;
    setTimeout(()=>$('#splash').classList.add('done'),900);
    toast('Could not reach the store server','err');renderRoute();return;
  }
  DB.ref('settings').on('value',snap=>{S.settings=deepMerge(DEF,snap.val()||{});applyTheme();
    if(!firstPaint){firstPaint=true;setTimeout(()=>$('#splash').classList.add('done'),1200);renderChips();renderRoute();}
    else{applyTheme();}});
  node('products',v=>{S.products=v||{};S.ready=true;});
  node('categories',v=>{S.categories=v||{};renderChips();});
  node('banners',v=>{S.banners=v||{};});
  node('faq',v=>{S.faq=v||{};});
  node('homepage/sections',v=>{if(v)S.sections=v;});
  DB.ref('reviews').orderByChild('approved').equalTo(true).on('value',snap=>{
    S.reviews=objArr(snap.val());
    const r=parseHash();if(['','home','p'].includes(r.name))refreshChrome();
  },()=>{});
  node('polls',v=>{S.polls=v||{};subscribePollVotes();});
  /* handle ?p= product deep link (works on static hosting) */
  const qs=new URLSearchParams(location.search);
  if(qs.get('p')){location.hash='#/p/'+encodeURIComponent(qs.get('p'));}
  renderChips();renderRoute();
  /* splash fallback + analytics */
  setTimeout(()=>{$('#splash').classList.add('done');if(!firstPaint){firstPaint=true;renderChips();renderRoute();}},3500);
  if(!sessionStorage.getItem('ec_viewed')){sessionStorage.setItem('ec_viewed','1');
    DB.ref('analytics/summary/views').transaction(v=>(v||0)+1).catch(()=>{});}
}
/* scroll polish: subtle header shrink */
let lastY=0;
window.addEventListener('scroll',()=>{const y=scrollY;const h=$('#hdr');const c=$('#chipsbar');
  if(y>90&&y>lastY){c.style.transform='translateY(-100%)';c.style.opacity='0';}
  else{c.style.transform='translateY(0)';c.style.opacity='1';}
  lastY=y;},{passive:true});
$('#chipsbar').style.transition='transform .28s ease,opacity .28s ease';
$('#chipsbar').style.top='60px';
document.addEventListener('DOMContentLoaded',boot);
window.closeSheet=closeSheet;window.PLH=PLH;window.SEARCHState=SHOP;
</script>
