<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="robots" content="noindex,nofollow">
<title>Store Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f7cff'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
:root{
  --primary:#4f7cff;--secondary:#8b5cf6;--accent:#22d3ee;
  --bg:#070b16;--surface:rgba(148,163,184,.07);--surface2:rgba(148,163,184,.12);
  --border:rgba(148,163,184,.14);--border2:rgba(148,163,184,.22);
  --text:#e8edf7;--muted:#929ab0;--muted2:#6b7386;
  --success:#34d399;--warn:#fbbf24;--danger:#fb7185;
  --radius:20px;--grad:linear-gradient(135deg,var(--primary),var(--secondary));
  --font:'Inter','Hind Siliguri',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:radial-gradient(700px 460px at 90% -10%,rgba(139,92,246,.13),transparent 60%),radial-gradient(600px 420px at 0% 10%,rgba(79,124,255,.11),transparent 60%),var(--bg);color:var(--text);min-height:100vh;font-size:14.5px;line-height:1.55}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::placeholder{color:var(--muted2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}

/* ===== LOGIN ===== */
#alogin{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .5s,visibility .5s}
#alogin.gone{opacity:0;visibility:hidden}
.lg-card{width:100%;max-width:400px;background:rgba(13,19,34,.72);backdrop-filter:blur(20px);border:1px solid var(--border2);border-radius:30px;padding:38px 30px;text-align:center;box-shadow:0 30px 80px rgba(2,6,18,.6);animation:lgin .7s cubic-bezier(.2,1.2,.3,1);position:relative;overflow:hidden}
.lg-card::before{content:"";position:absolute;top:-70px;left:50%;transform:translateX(-50%);width:240px;height:140px;background:radial-gradient(circle,rgba(79,124,255,.35),transparent 70%);filter:blur(10px);pointer-events:none}
@keyframes lgin{from{transform:translateY(24px) scale(.96);opacity:0}}
.lg-card.ok{animation:lgok .6s forwards}
@keyframes lgok{40%{box-shadow:0 0 0 3px var(--success),0 0 60px rgba(52,211,153,.4)}100%{box-shadow:0 0 0 3px var(--success),0 0 80px rgba(52,211,153,.5)}}
.lg-card.bad{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.lg-logo{width:70px;height:70px;margin:0 auto 16px;border-radius:22px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;box-shadow:0 12px 34px rgba(79,124,255,.4)}
.lg-card h1{font-size:21px;font-weight:900;letter-spacing:-.2px}
.lg-card>p{color:var(--muted);font-size:12.5px;margin:6px 0 22px}
.lg-field{position:relative;display:flex;align-items:center}
.lg-field input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:15px;padding:14px 48px 14px 16px;font-size:15px;letter-spacing:1.5px;outline:none;transition:border-color .2s;text-align:center;font-weight:700}
.lg-field input:focus{border-color:var(--accent)}
.lg-field button{position:absolute;right:8px;width:36px;height:36px;border-radius:11px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.lg-field button:hover{color:var(--text);background:var(--surface2)}
.lg-err{display:none;align-items:center;justify-content:center;gap:7px;color:var(--danger);font-size:12px;font-weight:700;margin-top:12px}
.lg-err.show{display:flex}
.lg-card .btn{margin-top:18px}
.lg-foot{margin-top:20px;font-size:10.5px;color:var(--muted2);display:flex;align-items:center;justify-content:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:700;font-size:13.5px;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(79,124,255,.35)}
.btn-g{background:var(--surface2);border:1px solid var(--border2)}
.btn-dg{background:rgba(251,113,133,.13);color:var(--danger);border:1px solid rgba(251,113,133,.3)}
.btn-ok{background:rgba(52,211,153,.13);color:var(--success);border:1px solid rgba(52,211,153,.3)}
.btn.sm{padding:8px 13px;font-size:12px;border-radius:11px}
.btn.lg{padding:14px 24px;font-size:15px;border-radius:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rt .7s linear infinite}
@keyframes rt{to{transform:rotate(360deg)}}

/* ===== APP SHELL ===== */
.awrap{display:flex;min-height:100vh}
#sidebar{width:250px;flex:none;background:rgba(10,15,28,.7);backdrop-filter:blur(18px);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:70;transition:transform .3s}
.sb-brand{display:flex;align-items:center;gap:11px;padding:6px 10px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sb-logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:16px;box-shadow:0 6px 18px rgba(79,124,255,.4)}
.sb-brand b{font-size:15px;font-weight:800;display:block}
.sb-brand span{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.sb-lab{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted2);padding:14px 12px 6px}
.nitem{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .18s;position:relative}
.nitem i{width:20px;text-align:center;font-size:14px}
.nitem:hover{color:var(--text);background:var(--surface)}
.nitem.on{color:#fff;background:var(--grad);box-shadow:0 6px 18px rgba(79,124,255,.35)}
.nitem .cnt{margin-left:auto;background:rgba(251,113,133,.9);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.sb-foot{margin-top:auto;padding:14px 12px 4px;font-size:10px;color:var(--muted2);border-top:1px solid var(--border)}
.amain{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;padding:12px 22px;background:rgba(7,11,22,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.topbar h2{font-size:17px;font-weight:800;letter-spacing:-.2px}
.live{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;color:var(--success);text-transform:uppercase;letter-spacing:.6px;padding:5px 12px;border-radius:99px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:blink 1.6s infinite}
.live.off{color:var(--danger);background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.3)}
.live.off i{background:var(--danger);box-shadow:0 0 10px var(--danger)}
@keyframes blink{50%{opacity:.35}}
.admchip{margin-left:auto;display:flex;align-items:center;gap:9px;padding:5px 13px 5px 6px;border-radius:99px;background:var(--surface);border:1px solid var(--border)}
.admchip .av{width:28px;height:28px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff}
.admchip span{font-size:12px;font-weight:700}
.iconbtn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);transition:all .2s;flex:none}
.iconbtn:hover{color:var(--text);background:var(--surface2)}
#apage{flex:1;padding:22px;width:100%;max-width:1150px;margin:0 auto}
@media(max-width:920px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);width:270px;box-shadow:30px 0 80px rgba(0,0,0,.5)}
  #sidebar.open{transform:translateX(0)}
  #apage{padding:16px 14px 110px}
}
#sbBg{position:fixed;inset:0;z-index:65;background:rgba(3,5,12,.6);display:none}
#sbBg.show{display:block}

/* bottom nav */
#abnav{position:fixed;bottom:0;left:0;right:0;z-index:65;display:none;background:rgba(8,12,24,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
@media(max-width:920px){#abnav{display:flex}}
.ab-it{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:12px;color:var(--muted);font-size:9.5px;font-weight:700;position:relative}
.ab-it i{font-size:16px}
.ab-it.on{color:var(--accent)}
.ab-it .cnt{position:absolute;top:1px;right:calc(50% - 20px);min-width:15px;height:15px;border-radius:99px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ===== COMPONENTS ===== */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:linear-gradient(150deg,var(--surface),transparent);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;transition:all .2s}
.kpi:hover{border-color:var(--border2);transform:translateY(-2px)}
.kpi i{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;margin-bottom:10px}
.kpi b{font-size:21px;font-weight:900;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);font-weight:600}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.acard h3{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.acard h3 i{color:var(--accent);font-size:12px}
.g2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:960px){.g2{grid-template-columns:1fr 1fr}.g2.wide{grid-template-columns:1.5fr 1fr}}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bars .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .bbar{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--grad);box-shadow:0 0 16px rgba(79,124,255,.3);min-height:4px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bars small{font-size:9.5px;color:var(--muted2);font-weight:700}

/* rows */
.orow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);margin-bottom:9px;transition:all .18s}
.orow:hover{border-color:var(--border2)}
.orow img.th{width:52px;height:52px;border-radius:13px;object-fit:cover;flex:none;background:var(--surface2)}
.orow .oi{flex:1;min-width:0}
.orow .ot{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .os{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flag{font-size:9px;font-weight:800;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
.flag.f{background:rgba(251,191,36,.14);color:#fbbf24}.flag.t{background:rgba(34,211,238,.13);color:var(--accent)}
.flag.b{background:rgba(251,113,133,.14);color:var(--danger)}.flag.n{background:rgba(52,211,153,.14);color:var(--success)}
.flag.off{background:var(--surface2);color:var(--muted2)}
.status{font-size:10px;font-weight:800;padding:4px 11px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.status.new{background:rgba(34,211,238,.13);color:var(--accent)}
.status.pending{background:rgba(251,191,36,.13);color:var(--warn)}
.status.confirmed{background:rgba(96,165,250,.13);color:#60a5fa}
.status.processing{background:rgba(139,92,246,.15);color:#a78bfa}
.status.shipped{background:rgba(56,189,248,.13);color:#38bdf8}
.status.delivered{background:rgba(52,211,153,.13);color:var(--success)}
.status.cancelled{background:rgba(251,113,133,.13);color:var(--danger)}

/* fields */
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:13px;padding:12px 14px;font-size:13.5px;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field .hint{font-size:10.5px;color:var(--muted2);margin-top:4px}
select option{background:#0d1526;color:var(--text)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.frow3{grid-template-columns:1fr}.frow{grid-template-columns:1fr}}
.tgl{position:relative;width:44px;height:25px;flex:none;display:inline-block;vertical-align:middle}
.tgl input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2;margin:0}
.tgl .tk{position:absolute;inset:0;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);transition:all .25s}
.tgl .tk::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#8b93a7;transition:all .25s}
.tgl input:checked + .tk{background:var(--grad);border-color:transparent}
.tgl input:checked + .tk::after{left:21px;background:#fff}
.swrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;font-size:13px;font-weight:600}
.swrow .sw-t{flex:1;min-width:0}
.swrow .sw-t small{display:block;color:var(--muted);font-weight:500;font-size:10.5px}
.chipbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.chip2{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);transition:all .2s}
.chip2.on{background:var(--grad);color:#fff;border-color:transparent}
.srch{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border2);border-radius:13px;padding:11px 14px;min-width:0}
.srch input{flex:1;background:none;border:none;outline:none;font-size:13.5px;min-width:0}
.cfield{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border2);border-radius:13px;padding:6px 6px 6px 14px}
.cfield input[type=color]{width:40px;height:34px;border:none;background:none;cursor:pointer;padding:0;border-radius:9px}
.cfield b{font-size:12px}
.cfield span{margin-left:auto;font-size:11px;color:var(--muted);padding-right:8px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--primary)}

/* modal */
.mwrap{position:fixed;inset:0;z-index:200;visibility:hidden}
.mwrap.open{visibility:visible}
.mbg{position:absolute;inset:0;background:rgba(3,5,12,.7);backdrop-filter:blur(5px);opacity:0;transition:opacity .3s}
.mwrap.open .mbg{opacity:1}
.mbox{position:absolute;left:0;right:0;bottom:0;max-height:92vh;margin:0 auto;max-width:660px;background:#0c1222;border:1px solid var(--border2);border-radius:26px 26px 0 0;transform:translateY(104%);transition:transform .36s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column}
.mwrap.open .mbox{transform:translateY(0)}
.mbox.wide{max-width:860px}
.mbox .mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);flex:none}
.mbox .mhead h3{font-size:15.5px;font-weight:800}
.mbox .mbody{overflow-y:auto;padding:18px 20px 26px}
.mbox .mfoot{flex:none;display:flex;gap:10px;padding:13px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.mbox .mfoot .btn{flex:1}
@media(min-width:760px){
  .mbox{left:50%;top:50%;bottom:auto;transform:translate(-50%,100vh) scale(.95);border-radius:26px;width:min(94vw,660px)}
  .mbox.wide{width:min(95vw,860px)}
  .mwrap.open .mbox{transform:translate(-50%,-50%) scale(1)}
}
.etabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;flex:none;border-bottom:1px solid var(--border);margin-bottom:16px}
.etabs::-webkit-scrollbar{display:none}
.etab-b{flex:none;padding:9px 15px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);transition:all .2s;white-space:nowrap}
.etab-b.on{background:var(--grad);color:#fff;border-color:transparent}
.etab-b .fa-circle{font-size:6px;color:var(--danger);margin-left:5px;vertical-align:middle}

/* empty / skeleton / toast */
.empty{display:flex;flex-direction:column;align-items:center;gap:11px;padding:44px 20px;text-align:center}
.empty .eic{width:70px;height:70px;border-radius:22px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted)}
.empty h3{font-size:15px;font-weight:800}
.empty p{font-size:12px;color:var(--muted);max-width:270px}
.skel{position:relative;overflow:hidden;background:var(--surface);border-radius:16px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shim 1.4s infinite}
@keyframes shim{to{transform:translateX(100%)}}
#atoasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;width:min(92vw,400px)}
.toast{display:flex;align-items:center;gap:10px;background:rgba(10,15,30,.94);backdrop-filter:blur(14px);border:1px solid var(--border2);border-radius:15px;padding:12px 16px;font-size:12.5px;font-weight:600;box-shadow:0 10px 30px rgba(2,6,18,.5);animation:tin .3s cubic-bezier(.2,1.2,.3,1)}
.toast.ok i{color:var(--success)}.toast.err i{color:var(--danger)}.toast.info i{color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .3s}
.pghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pghead h1{font-size:19px;font-weight:900;letter-spacing:-.3px}
.pghead .sp{flex:1}
.qag{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 10px;border-radius:18px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);transition:all .2s;text-align:center}
.qa:hover{border-color:var(--border2);transform:translateY(-2px);color:var(--text)}
.qa i{width:42px;height:42px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:0 6px 16px rgba(79,124,255,.3)}
.ravs{display:flex;align-items:center;gap:10px}

/* ================================================================

const safeImg=u=>{u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:PLH};

/* ---------- firebase ---------- */
const firebaseConfig={apiKey:"AIzaSyAiByTzOZNcGBlti12VcU24kuGelfmjhmrc",authDomain:"ecomweb-9ae2b.firebaseapp.com",databaseURL:"https://ecomweb-9ae2b-default-rtdb.firebaseio.com",projectId:"ecomweb-9ae2b",storageBucket:"ecomweb-9ae2b.firebasestorage.app",messagingSenderId:"355191640187",appId:"1:355191640187:web:5b2505b5b1631f0a4612de",measurementId:"G-NGJ887WQL1"};

 payment:{cod:{enabled:true,label:'Cash on Delivery',number:'',icon:'fa-solid fa-money-bill-wave',color:'#34d399',instruction:'Pay in cash when your order arrives.'},
   bkash:{enabled:false,label:'bKash',number:'01XXXXXXXXX',icon:'fa-solid fa-mobile-screen',color:'#e2136e',instruction:'Send Money to this personal number, then keep the TrxID.'},
   nagad:{enabled:false,label:'Nagad',number:'01XXXXXXXXX',icon:'fa-solid fa-mobile-screen',color:'#f6921e',instruction:'Send Money to this personal number, then keep the TrxID.'}},
 trust:[{icon:'fa-solid fa-shield-halved',title:'Secure Ordering',text:'Your details stay safe with us.'},{icon:'fa-solid fa-truck-fast',title:'Fast Delivery',text:'Quick, careful doorstep delivery.'},{icon:'fa-solid fa-headset',title:'Friendly Support',text:'We reply fast on chat and phone.'},{icon:'fa-solid fa-award',title:'Quality Products',text:'Every item checked before dispatch.'}],

 theme:{primary:'#4f7cff',secondary:'#8b5cf6',accent:'#22d3ee',bg:'#070b16',text:'#e8edf7',radius:22,glow:.55},

 seo:{description:'Premium online shopping. Quality products, fast delivery, easy ordering.'},
 homeSections:{hero:{enabled:true,order:1},promo:{enabled:true,order:2},categories:{enabled:true,order:3,title:'Shop by Category',subtitle:'Find exactly what you need'},featured:{enabled:true,order:4,title:'Featured Products',subtitle:'Handpicked for you',count:8,layout:'scroll'},best:{enabled:true,order:5,title:'Best Sellers',subtitle:'Customer favourites',count:8,layout:'grid'},trending:{enabled:true,order:6,title:'Trending Now',subtitle:'What everyone is buying',count:8,layout:'scroll'},newest:{enabled:true,order:7,title:'New Arrivals',subtitle:'Fresh in store',count:8,layout:'grid'},deals:{enabled:true,order:8,title:'Special Deals',subtitle:'Save more today',count:8,layout:'grid'},limited:{enabled:true,order:9},trust:{enabled:true,order:10,title:'Why Shop With Us'},reviews:{enabled:true,order:11,title:'Customer Reviews',subtitle:'Real feedback from buyers'},poll:{enabled:true,order:12,title:'Your Opinion Matters'},howworks:{enabled:true,order:13,title:'How It Works'},faq:{enabled:true,order:14,title:'Frequently Asked Questions'},newsletter:{enabled:true,order:15},social:{enabled:false,order:16,title:'Follow Us'}}
};

const SECTION_NAMES={hero:'Hero Banner',promo:'Promo Strip',categories:'Category Grid',featured:'Featured Products',best:'Best Sellers',trending:'Trending Products',newest:'New Arrivals',deals:'Special Deals',limited:'Limited Offer',trust:'Trust / Benefits',reviews:'Customer Reviews',poll:'Poll / Voting',howworks:'How It Works',faq:'FAQ',newsletter:'Newsletter',social:'Social Links'};

/* ---------- state ---------- */
const A={page:'dashboard',settings:null,products:{},categories:{},orders:{},customers:{},reviews:{},polls:{},pollVotes:{},banners:{},faq:{},sections:null,loaded:false};
const SAVE=d=>{if(!fbOK){toast('No connection — cannot save','err');return Promise.reject('offline');}return d;};
const CURR=()=>(A.settings&&A.settings.currency)||'৳';
const fmt=n=>CURR()+Number(n||0).toLocaleString('en-IN');
function priceInfo(p){const now=Number(p.offerPrice)>0?Number(p.offerPrice):Number(p.regularPrice)||0;const was=Number(p.regularPrice)||0;const off=(was>0&&now>0&&was>now)?Math.round((1-now/was)*100):0;return{now,was,off};}
function stockOf(p){let s=p.stockStatus||'auto';if(s==='auto'){const q=Number(p.stock);if(p.comingSoon)return'soon';if(isNaN(q))return'in';return q<=0?'out':q<=Number(p.lowAt||5)?'low':'in';}return s;}
const ORD_STATUSES=['new','pending','confirmed','processing','shipped','delivered','cancelled'];
const REVENUE_STATUSES=['confirmed','processing','shipped','delivered'];

/* ---------- auth ---------- */
const SESS_KEY='ec_admin_sess',SESS_DAYS=7;
const sess=()=>{const s=L.get(SESS_KEY,null);return s&&s.ok&&s.exp>Date.now()?s:null};
function fetchKey(){if(!fbOK)return Promise.resolve('SIAMVIP');return DB.ref('admin/config/key').once('value').then(s=>s.val()||'SIAMVIP').catch(()=>'SIAMVIP');}
function showErr(m){$('#lgErrT').textContent=m;$('#lgErr').classList.add('show');const c=$('#lgCard');c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');}
function doLogin(){
  const key=$('#lgKey').value.trim();
  if(!key)return showErr('Please enter your access key');
  const btn=$('#lgBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span>Verifying…';$('#lgErr').classList.remove('show');
  fetchKey().then(real=>{
    if(key===real){
      L.set(SESS_KEY,{ok:true,exp:Date.now()+SESS_DAYS*864e5});
      btn.innerHTML='<i class="fa-solid fa-check"></i>Access granted';
      $('#lgCard').classList.add('ok');
      setTimeout(()=>enter(true),600);
    }else{
      btn.disabled=false;btn.innerHTML='Sign In<i class="fa-solid fa-arrow-right" style="font-size:12px"></i>';
      showErr('Invalid access key — try again');$('#lgKey').select();
    }
  });
}
function enter(anim){
  if(anim)$('#alogin').classList.add('gone');else $('#alogin').style.display='none';
  $('#aapp').classList.remove('hidden');
  renderNav();subscribe();
  const h=(location.hash||'').replace(/^#\//,'');
  navTo(PAGES.some(p=>p[0]===h)?h:'dashboard');
}
window.adminLogout=()=>confirmDlg('Logout','End this admin session on this device?','Logout',true,()=>{L.set(SESS_KEY,null);location.reload();});

/* ---------- navigation ---------- */
const PAGES=[['dashboard','Dashboard','fa-solid fa-house','Main'],['products','Products','fa-solid fa-box','Main'],['orders','Orders','fa-solid fa-receipt','Main'],['customers','Customers','fa-solid fa-users','Main'],['reviews','Reviews','fa-solid fa-star','Content'],['polls','Polls','fa-solid fa-square-poll-vertical','Content'],['banners','Banners','fa-solid fa-images','Content'],['homepage','Homepage','fa-solid fa-layer-group','Store'],['categories','Categories','fa-solid fa-grip','Store'],['theme','Theme & Brand','fa-solid fa-palette','Store'],['payment','Payments','fa-solid fa-credit-card','Store'],['settings','Settings','fa-solid fa-gear','Store']];
const MORE_PAGES=PAGES.filter(p=>!['dashboard','products','orders','reviews'].includes(p[0]));
function renderNav(){
  const groups={};PAGES.forEach(p=>{(groups[p[3]]=groups[p[3]]||[]).push(p)});
  $('#sbNav').innerHTML=Object.entries(groups).map(([g,items])=>`<div class="sb-lab">${g}</div>${items.map(p=>{
    let badge='';
    if(p[0]==='orders'){const n=Object.values(A.orders).filter(o=>['new','pending'].includes(o.status)).length;if(n)badge=`<span class="cnt">${n}</span>`;}
    if(p[0]==='reviews'){const n=Object.values(A.reviews).filter(r=>r.approved===false).length;if(n)badge=`<span class="cnt">${n}</span>`;}
    return`<button class="nitem" data-pg="${p[0]}"><i class="${p[2]}"></i>${p[1]}${badge}</button>`;}).join('')}`).join('');
  const n=Object.values(A.orders).filter(o=>['new','pending'].includes(o.status)).length;
  $('#abOrderCnt').textContent=n;$('#abOrderCnt').classList.toggle('hidden',!n);
  $$('#sbNav .nitem, #abnav .ab-it').forEach(b=>b.classList.toggle('on',b.dataset.pg===A.page));
}
function navTo(pg){
  if(pg==='__more'){openModal(`<div class="mhead"><h3>Admin Menu</h3><button class="iconbtn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="mbody" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${MORE_PAGES.map(p=>`<button class="qa" data-nav2="${p[0]}" style="flex-direction:row;justify-content:flex-start;padding:14px"><i class="${p[2]}" style="width:34px;height:34px;font-size:13px"></i>${p[1]}</button>`).join('')}
    <button class="qa" data-do="logout" style="flex-direction:row;justify-content:flex-start;padding:14px;color:var(--danger)"><i class="fa-solid fa-arrow-right-from-bracket" style="width:34px;height:34px;font-size:13px;background:rgba(251,113,133,.2)"></i>Logout</button></div>`);return;}
  A.page=pg;closeModal();
  $('#pgTitle').textContent=(PAGES.find(p=>p[0]===pg)||PAGES[0])[1];

  const ld=e.target.closest('[data-do=logout]');if(ld){closeModal();adminLogout();return;}
});

window.addEventListener('hashchange',()=>{const h=(location.hash||'').replace(/^#\//,'');if(PAGES.some(p=>p[0]===h)&&h!==A.page)navTo(h);});
const mq=matchMedia('(max-width:920px)');const setMenuBtn=()=>$('#mMenu').style.display=mq.matches?'flex':'none';mq.addListener(setMenuBtn);setMenuBtn();

/* ---------- data ---------- */
function subscribe(){
  const on=(path,fn,gap=700)=>{let last=0,t;DB.ref(path).on('value',s=>{fn(s.val());clearTimeout(t);const n=Date.now();if(n-last>gap){last=n;refresh();}else t=setTimeout(()=>{last=Date.now();refresh()},gap);},()=>{});};
  DB.ref('settings').once('value').then(()=>{});
  DB.ref('settings').on('value',s=>{A.settings=deepMerge(DEF,s.val()||{});$('#sbName').textContent='Store Admin';
    if(!A.loaded){A.loaded=true;refresh(true);}else refreshSoft();});
  on('products',v=>A.products=v||{});
  on('orders',v=>{A.orders=v||{};renderNav();});
  on('customers',v=>A.customers=v||{});
  on('reviews',v=>{A.reviews=v||{};renderNav();});
  on('polls',v=>A.polls=v||{});
  on('pollVotes',v=>A.pollVotes=v||{});
  on('banners',v=>A.banners=v||{});
  on('faq',v=>A.faq=v||{});
  on('homepage/sections',v=>{if(v)A.sections=v;});
  on('categories',v=>A.categories=v||{});
}
function refresh(){if(A.loaded)renderPage();}
function refreshSoft(){renderPage();}
function renderPage(){
  const v=$('#apage');
  if(!A.settings){v.innerHTML='<div class="skel" style="height:120px;margin-bottom:12px"></div><div class="skel" style="height:120px"></div>';return;}
  const map={dashboard:pDash,products:pProducts,orders:pOrders,customers:pCustomers,reviews:pReviews,polls:pPolls,banners:pBanners,homepage:pHomepage,categories:pCategories,theme:pTheme,payment:pPayment,settings:pSettings};
  v.innerHTML=(map[A.page]||pDash)();
}

  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement===$('#lgKey')&&!$('#alogin').classList.contains('gone'))doLogin();if(e.key==='Escape')closeModal();});

  if(sess())enter(false);
  setTimeout(()=>{if(!$('#aapp')||$('#aapp').classList.contains('hidden'))$('#lgKey').focus()},300);

/* ---------- DASHBOARD ---------- */
function ordersArr(){return Object.entries(A.orders).map(([id,o])=>({id,...o,items:o.items||[]})).sort((a,b)=>(b.ts||0)-(a.ts||0));}
function pDash(){
  const os=ordersArr();
  const revenue=os.filter(o=>REVENUE_STATUSES.includes(o.status)).reduce((a,o)=>a+(Number(o.total)||0),0);
  const pending=os.filter(o=>['new','pending'].includes(o.status)).length;
  const delivered=os.filter(o=>o.status==='delivered').length;
  const prods=Object.keys(A.products).length;
  const custs=Object.keys(A.customers).length;
  const revs=Object.keys(A.reviews).length;

  const perDay=days.map(d=>{const nxt=d.getTime()+864e5;const inD=os.filter(o=>o.ts>=d.getTime()&&o.ts<nxt);return{n:inD.length,s:inD.reduce((a,o)=>a+(Number(o.total)||0),0)}});

    ${kpi('fa-solid fa-users','linear-gradient(135deg,#ec4899,#be185d)',custs,'Customers')}
    ${kpi('fa-solid fa-star','linear-gradient(135deg,#fbbf24,#f59e0b)',revs,'Reviews')}
  </div>
  <div class="g2 wide">
    <div class="acard"><h3><i class="fa-solid fa-chart-column"></i>Orders — Last 7 Days</h3>
      <div class="bars">${perDay.map((x,i)=>`<div class="bcol"><small style="color:var(--text)">${x.n||''}</small><div class="bbar" style="height:${Math.round(x.n/maxN*100)}%" title="${x.n} orders"></div><small>${days[i].toLocaleDateString('en-GB',{weekday:'short'})}</small></div>`).join('')}</div>
    </div>
    <div class="acard"><h3><i class="fa-solid fa-bolt"></i>Quick Actions</h3>
      <div class="qag">

        <button class="qa" data-pg="banners"><i class="fa-solid fa-images"></i>Banners</button>
        <button class="qa" data-pg="homepage"><i class="fa-solid fa-layer-group"></i>Homepage</button>

        <button class="qa" data-pg="reviews"><i class="fa-solid fa-star"></i>Reviews</button>

  <div class="g2">

      ${os.slice(0,5).map(o=>`<div class="orow"><div class="oi"><div class="ot">${esc(o.orderId||o.id)}</div><div class="os">${esc((o.customer||{}).name||'—')} · ${dShort(o.ts)} · <b style="color:var(--text)">${fmt(o.total)}</b></div></div><span class="status ${esc(o.status||'pending')}">${esc(o.status||'pending')}</span></div>`).join('')||'<div class="empty" style="padding:26px"><div class="eic"><i class="fa-solid fa-receipt"></i></div><p>No orders yet</p></div>'}

/* product editor */
const ETABS=[['basic','Basic'],['price','Pricing'],['stock','Inventory'],['media','Media'],['content','Content'],['market','Marketing'],['order','Ordering'],['vis','Visibility']];
let PET={tab:'basic',id:''};
window.openProductEditor=id=>{
  PET={tab:'basic',id};
  renderPEditor();
};
function ep(id,v){return `<div class="field"><label>${v.l}</label><input id="${id}" ${v.t?`type="${v.t}"`:''} value="${esc(v.v??'')}" placeholder="${esc(v.ph||'')}" ${v.im?`inputmode="${v.im}"`:''}>${v.h?`<div class="hint">${esc(v.h)}</div>`:''}</div>`;}
function sw(id,label,hint,on){return`<div class="swrow"><div class="sw-t">${label}${hint?`<small>${hint}</small>`:''}</div><label class="tgl"><input type="checkbox" id="${id}" ${on?'checked':''}><span class="tk"></span></label></div>`;}
function renderPEditor(){
  const id=PET.id;const p=id?(A.products[id]||{}):{};
  const isNew=!id;
  const cats=objArr(A.categories).sort((x,y)=>(x.order||99)-(y.order||99));
  const v=(fixArr(p.variants)).map(x=>`${x.label}${Number(x.delta)?' | +'+(Number(x.delta)):''}`).join('\n');
  const imgs=(Array.isArray(p.images)?p.images:[]).join('\n');
  const specs=fixArr(p.specs).map(x=>`${x.k||x.key||''}: ${x.v||x.value||''}`).join('\n');
  const feats=fixArr(p.features).map(x=>typeof x==='string'?x:(x.text||x.value||'')).join('\n');
  const kws=fixArr(p.keywords).join(', ');
  const tab=PET.tab;
  const o=p.orderOpts||{};
  let body='';
  if(tab==='basic')body=`
    ${ep('fName',{l:'Product Name *',v:p.name,ph:'e.g. Wireless Bluetooth Headphones'})}
    ${ep('fShort',{l:'Short Title',v:p.shortTitle,ph:'Short name shown on cards'})}
    <div class="frow">
      <div class="field"><label>Category</label><select id="fCat"><option value="">Uncategorized</option>${cats.map(c=>`<option value="${esc(c.id)}" ${p.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      ${ep('fSubcat',{l:'Subcategory',v:p.subcategory,ph:'Optional'})}
    </div>
    <div class="frow">${ep('fBrand',{l:'Brand',v:p.brand})}${ep('fSku',{l:'SKU / Model',v:p.sku,ph:'e.g. HDX-100'})}</div>
    ${ep('fBadge',{l:'Badge Label',v:p.badge,ph:'e.g. HOT, SALE, -20%'})}
    ${ep('fSold',{l:'Sold Count (display)',v:p.sold,t:'number',h:'Shown as social proof on product cards.'})}`;
  else if(tab==='price')body=`
    <div class="frow">
      ${ep('fReg',{l:'Regular Price (৳) *',v:p.regularPrice,t:'number',im:'decimal'})}
      ${ep('fOff',{l:'Offer Price (৳)',v:p.offerPrice,t:'number',im:'decimal',h:'Leave empty to use regular price'})}
    </div>
    <div class="acard" style="margin:0"><h3><i class="fa-solid fa-calculator"></i>Live Preview</h3><div id="pricePrev" style="font-size:13.5px"></div></div>`;
  else if(tab==='stock')body=`
    <div class="frow">
      ${ep('fStock',{l:'Stock Quantity',v:p.stock,t:'number',h:'Leave empty to skip tracking'})}
      ${ep('fLow',{l:'Low Stock Alert At',v:p.lowAt??5,t:'number'})}
    </div>
    <div class="field"><label>Stock Status</label><select id="fSt">
      ${[['auto','Auto (from quantity)'],['in','In Stock'],['low','Low Stock'],['out','Out of Stock'],['soon','Coming Soon']].map(x=>`<option value="${x[0]}" ${(p.stockStatus||'auto')===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>`;
  else if(tab==='media')body=`
    <div class="field"><label>Image URLs — one per line *</label><textarea id="fImgs" rows="4" placeholder="https://…/image1.jpg&#10;https://…/image2.jpg">${esc(imgs)}</textarea><div class="hint">First image becomes the thumbnail. Direct image URLs only (PNG/JPG/WEBP).</div></div>
    <div class="acard" style="margin:0"><h3><i class="fa-solid fa-image"></i>Preview</h3><div id="imgPrev" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>`;
  else if(tab==='content')body=`
    ${ep('fSDesc',{l:'Short Description',v:p.shortDesc,ph:'1–2 lines under the title'})}
    <div class="field"><label>Full Description</label><textarea id="fDesc" rows="5" placeholder="Full product story, usage, warranty…">${esc(p.description||'')}</textarea></div>
    <div class="field"><label>Specifications — one per line "Key: Value"</label><textarea id="fSpecs" rows="4" placeholder="Battery: 30 hours&#10;Bluetooth: 5.3">${esc(specs)}</textarea></div>
    <div class="field"><label>Feature Bullets — one per line</label><textarea id="fFeats" rows="3" placeholder="Active noise cancellation&#10;Fast charging">${esc(feats)}</textarea></div>
    ${ep('fKws',{l:'Search Keywords',v:kws,h:'Comma separated for store search'})}
    <div class="field"><label>Delivery Info (optional override)</label><input id="fDeliv" value="${esc(p.deliveryInfo||'')}" placeholder="e.g. Ships within 24 hours"></div>`;
  else if(tab==='market')body=`
    <div class="field"><label>Variant Label</label><input id="fVarName" value="${esc(p.variantName||'')}" placeholder="e.g. Color, Size, Model"></div>
    <div class="field"><label>Variants — one per line "Label | +extra price"</label><textarea id="fVars" rows="4" placeholder="Black&#10;White | +100&#10;Blue | +150">${esc(v)}</textarea></div>
    <h3 style="font-size:13px;font-weight:800;margin:14px 0 10px">Marketing Flags</h3>
    ${sw('fFeat','Featured','Shown in Featured section',p.featured)}
    ${sw('fTrend','Trending','Shown in Trending section',p.trending)}
    ${sw('fBest','Best Seller','Shown in Best Sellers section',p.best)}
    ${sw('fNew','New Arrival','Shown in New Arrivals section',p.isNew)}
    ${ep('fOrderNote',{l:'WhatsApp Order Note',v:p.orderNote,h:'Appended to WhatsApp order messages for this product'})}`;
  else if(tab==='order')body=`
    ${sw('oWeb','Website Checkout','Allow checkout on the website',o.web!==false)}
    ${sw('oWa','WhatsApp Ordering','Show WhatsApp order button',o.wa!==false)}
    ${sw('oFb','Facebook Ordering','Show Facebook/Messenger button',o.fb!==false)}
    ${sw('oCall','Call Ordering','Show call-to-order button',o.call!==false)}
    <p class="hint">Destinations (WhatsApp number, Facebook page…) are configured under Settings.</p>`;
  else body=`
    ${sw('fVis','Active / Visible','Show this product in the store',p.visible!==false)}
    ${ep('fOrder',{l:'Display Order',v:p.order??999,t:'number',h:'Lower numbers appear first'})}
    ${p.ts?`<p class="hint">Created: ${fmtDate(p.ts)}</p>`:''}`;
  openModal(`<div class="mhead"><h3><i class="fa-solid ${isNew?'fa-plus':'fa-pen'}" style="color:var(--accent);margin-right:8px"></i>${isNew?'Add Product':'Edit Product'}</h3><button class="iconbtn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
   <div class="mbody">
     <div class="etabs">${ETABS.map(t=>`<button class="etab-b ${tab===t[0]?'on':''}" data-etab="${t[0]}">${t[1]}</button>`).join('')}</div>
     ${body}
   </div>
   <div class="mfoot"><button class="btn btn-g" onclick="closeModal()">Cancel</button><button class="btn btn-p" id="pSave"><i class="fa-solid fa-floppy-disk"></i>Save Product</button></div>`,true);
  wireEditor(id);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-etab]');if(t){PET.tab=t.dataset.etab;renderPEditor();return;}
});
function gv(id){const el=document.getElementById(id);return el?el.value:'';}
function gn(id){const n=Number(gv(id));return isNaN(n)?'':n;}
function gc(id){const el=document.getElementById(id);return el?el.checked:false;}
function lines(id){return gv(id).split('\n').map(x=>x.trim()).filter(Boolean);}
function wireEditor(id){
  const prev=()=>{const el=document.getElementById('pricePrev');if(!el)return;
    const r=Number(gv('fReg'))||0,o=Number(gv('fOff'))||0;
    const now=o>0?o:r;const off=(r>now&&now>0)?Math.round((1-now/r)*100):0;
    el.innerHTML=r?`<b style="color:var(--accent);font-size:17px">${fmt(now)}</b> ${off?`<span style="text-decoration:line-through;color:var(--muted2)">${fmt(r)}</span> <span class="flag n">${off}% OFF · Save ${fmt(r-now)}</span>`:'<span class="flag off">Regular price</span>'}`:'<span class="muted">Enter prices to preview</span>';};
  ['fReg','fOff'].forEach(x=>{const el=document.getElementById(x);if(el)el.addEventListener('input',prev)});prev();
  const imgPrev=()=>{const el=document.getElementById('imgPrev');if(!el)return;
    el.innerHTML=lines('fImgs').map(u=>`<img src="${safeImg(u)}" style="width:62px;height:62px;border-radius:12px;object-fit:cover" onerror="this.style.opacity=.25">`).join('')||'<span class="muted small">Add URLs to preview</span>';};
  const ti=document.getElementById('fImgs');if(ti)ti.addEventListener('input',debounce(imgPrev,300));imgPrev();
  $('#pSave').onclick=()=>saveProduct(id);
}
function saveProduct(id){
  const name=gv('fName').trim();
  const reg=Number(gn('fReg'))||0;
  if(name.length<2)return toast('Product name is required (Basic tab)','err');
  if(reg<=0)return toast('Regular price is required (Pricing tab)','err');
  const imgs=lines('fImgs');
  if(!imgs.length&&id&&!(A.products[id].images||[]).length)return toast('Add at least one image URL (Media tab)','err');
  const btn=$('#pSave');btn.disabled=true;btn.innerHTML='<span class="spin"></span>Saving…';
  const old=id?(A.products[id]||{}):{};
  const variants=lines('fVars').map(l=>{const[label,delta]=l.split('|').map(x=>x.trim());return{label,delta:Number(delta)||0}}).filter(x=>x.label);
  const specs=lines('fSpecs').map(l=>{const i=l.indexOf(':');return i>0?{k:l.slice(0,i).trim(),v:l.slice(i+1).trim()}:null}).filter(Boolean);
  const features=lines('fFeats');
  const keywords=gv('fKws').split(',').map(x=>x.trim()).filter(Boolean);
  const off=Number(gn('fOff'))||0;
  const rec={
    ...old,name,shortTitle:gv('fShort').trim(),category:gv('fCat'),subcategory:gv('fSubcat').trim(),
    brand:gv('fBrand').trim(),sku:gv('fSku').trim(),badge:gv('fBadge').trim(),sold:Number(gn('fSold'))||0,
    regularPrice:reg,offerPrice:off>0&&off<reg?off:0,
    stock:gv('fStock')===''?'':Number(gn('fStock'))||0,lowAt:Number(gn('fLow'))||5,
    stockStatus:gv('fSt')||'auto',
    images:imgs.length?imgs:(old.images||[]),thumb:(imgs[0]||(old.images||[])[0]||''),
    shortDesc:gv('fSDesc').trim(),description:gv('fDesc'),specs,features,keywords,deliveryInfo:gv('fDeliv').trim(),
    variantName:gv('fVarName').trim(),variants,orderNote:gv('fOrderNote').trim(),
    featured:gc('fFeat'),trending:gc('fTrend'),best:gc('fBest'),isNew:gc('fNew'),
    orderOpts:{web:gc('oWeb'),wa:gc('oWa'),fb:gc('oFb'),call:gc('oCall')},
    visible:gc('fVis'),order:Number(gn('fOrder'))||999,
    updatedAt:Date.now(),ts:old.ts||Date.now()
  };
  const req=id?DB.ref('products/'+id).update(rec):DB.ref('products').push(rec);
  SAVE(req).then(()=>{closeModal();toast(id?'Product updated':'Product added');}).catch(()=>{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-floppy-disk"></i>Save Product';});
}

function openPollStats(id){
  const p=A.polls[id];if(!p)return;
  const votes=Object.values(A.pollVotes[id]||{}).filter(v=>!v.local);
  const real=(p.options||[]).map((_,i)=>votes.filter(v=>Number(v.o??v.option)===i).length);
  const boost=(p.options||[]).map((_,i)=>Number((p.displayBoost||{})[i])||0);
  const shown=real.map((n,i)=>n+boost[i]);
  const tot=Math.max(1,shown.reduce((a,b)=>a+b,0));
  openModal(`<div class="mhead"><h3><i class="fa-solid fa-chart-simple" style="color:var(--accent);margin-right:8px"></i>Poll Statistics</h3><button class="iconbtn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="mbody">
    <p style="font-size:13.5px;font-weight:700;margin-bottom:14px">${esc(p.question)}</p>
    ${(p.options||[]).map((o,i)=>`<div style="margin-bottom:13px">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px"><span>${esc(o)}</span><span>${Math.round(shown[i]/tot*100)}%</span></div>
      <div class="vbar"><i style="width:${Math.round(shown[i]/tot*100)}%"></i></div>
      <div class="hint" style="margin-top:4px">Real customer votes: <b>${real[i]}</b>${boost[i]?` + display offset: <b>${boost[i]}</b> · Total shown: <b>${shown[i]}</b>`:''}</div>
    </div>`).join('')}
    <div class="hint">Real votes are collected from customers only. Offsets are admin-configured starting numbers.</div>
  </div>`);
}

document.addEventListener('change',e=>{
  if(e.target.id==='dlImp'&&e.target.files[0]){
    const f=e.target.files[0];const rd=new FileReader();
    rd.onload=()=>{try{const data=JSON.parse(rd.result);
      if(!data||typeof data!=='object')throw 0;
      confirmDlg('Import Data','This will overwrite imported sections in Firebase. Continue?','Import',false,()=>{
        const upd={};['products','categories','banners','reviews','polls','faq','settings','homepage'].forEach(k=>{if(data[k])upd[k]=data[k];});
        SAVE(DB.ref().update(upd)).then(()=>toast('Import complete')).catch(()=>{});});
    }catch(x){toast('Invalid JSON file','err');}};
    rd.readAsText(f);e.target.value='';

function exportJSON(){
  DB.ref().once('value').then(s=>{
    const blob=new Blob([JSON.stringify(s.val(),null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='store-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
    URL.revokeObjectURL(a.href);toast('Backup downloaded');
  }).catch(()=>toast('Export failed','err'));
}
